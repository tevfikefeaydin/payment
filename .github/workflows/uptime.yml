name: Uptime

# The project is no longer online, so scheduled uptime checks are paused.
# Run this check manually when needed. Restore the schedule only after the
# production service is online again.

on:
  workflow_dispatch:

permissions: {}

jobs:
  web:
    name: Web /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe https://payment-web-ruddy.vercel.app/health
        run: |
          status=$(curl -sS -o body.json -w "%{http_code}" --max-time 20 \
            "https://payment-web-ruddy.vercel.app/health" || echo "000")
          echo "HTTP $status"
          cat body.json 2>/dev/null || true
          if [ "$status" != "200" ]; then
            echo "::error::Web health check failed with HTTP $status"
            exit 1
          fi
