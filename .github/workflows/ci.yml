name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  # Pinned in package.json (engines.node / packageManager). Keep in step with
  # pnpm-workspace.yaml and docs/adr/0001-toolchain-and-versions.md.
  NODE_VERSION: "24"
  PNPM_VERSION: "10.34.5"

jobs:
  # ---------------------------------------------------------------------------
  # Install once, then fan out. Every downstream job restores the same pnpm
  # store, so the lockfile is resolved exactly once per run.
  # ---------------------------------------------------------------------------
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml does not match the manifests,
      # so CI can never silently resolve different versions than a developer did.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  format:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Also enforces the architectural invariants configured in
      # eslint.config.js: no floating-point money helpers inside
      # packages/domain, and no imports between the two Stripe contexts.
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # Pure tests. No database, no external services, no secrets.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  # ---------------------------------------------------------------------------
  # Integration tests against a real PostgreSQL 17, matching production.
  # The suite applies the checked-in migrations to an empty database, which also
  # proves the migrations still apply cleanly from scratch.
  # ---------------------------------------------------------------------------
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payrecon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Secrets are GENERATED per run, never stored in the repository or in
      # GitHub secrets. These values exist only for the life of this job and
      # protect nothing real. ENCRYPTION_KEY must decode to exactly 32 bytes;
      # AUTH_SECRET must be at least 32 characters.
      - name: Generate ephemeral test secrets
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Run integration tests
        env:
          NODE_ENV: test
          APP_URL: http://localhost:3000
          LOG_LEVEL: warn
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payrecon_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payrecon_test
          ENCRYPTION_KEY_ID: ci
          # Use the deterministic in-repo adapter: no live Stripe credential is
          # required for the default test suite.
          STRIPE_CUSTOMER_TRANSPORT: fake
        run: pnpm test:integration

  # ---------------------------------------------------------------------------
  # Production build of both applications.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test-unit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `next build` reads configuration at build time. These are placeholders
      # with no security meaning; real values are injected at runtime and no
      # secret is ever baked into an artifact or an image.
      - name: Generate ephemeral build-time secrets
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build web and worker
        env:
          NODE_ENV: production
          APP_URL: https://ci.invalid
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payrecon_build
          ENCRYPTION_KEY_ID: ci
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Single required status check: green only when everything above is green.
  # Branch protection should require this job rather than each job individually.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test-unit, test-integration, build]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed (result: $result)."
              exit 1
            fi
          done
          echo "All required jobs succeeded."

