packages:
  - "apps/*"
  - "packages/*"

# Centralised dependency versions. Every workspace package references these via
# `catalog:` so that a version is defined exactly once for the whole monorepo.
# See docs/adr/0001-toolchain-and-versions.md for why these versions were chosen.
catalog:
  # --- runtime / framework ---
  next: 16.3.0
  react: 19.2.8
  react-dom: 19.2.8

  # --- language / build ---
  typescript: 5.9.3
  tsx: 4.23.11

  # --- database ---
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0

  # --- jobs ---
  pg-boss: 12.27.0

  # --- validation ---
  zod: 4.4.3

  # --- configuration ---
  dotenv: 17.4.2

  # --- external services ---
  stripe: 22.4.0
  nodemailer: 9.0.5

  # --- parsing ---
  csv-parse: 7.0.2

  # --- logging ---
  pino: 10.3.1

  # --- styling ---
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3

  # --- testing ---
  vitest: 4.1.10
  "@playwright/test": 1.62.1

  # --- lint / format ---
  eslint: 9.39.5
  typescript-eslint: 8.66.0
  prettier: 3.9.6

  # --- types ---
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@types/pg": 8.21.0
  "@types/nodemailer": 8.0.1
