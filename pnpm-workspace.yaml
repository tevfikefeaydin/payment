packages:
  - "apps/*"
  - "packages/*"

# Centralised dependency versions. Every workspace package references these via
# `catalog:` so that a version is defined exactly once for the whole monorepo.
# See docs/adr/0001-toolchain-and-versions.md for why these versions were chosen.
catalog:
  # --- runtime / framework ---
  next: 16.4.0
  react: 19.3.0
  react-dom: 19.3.0

  # --- language / build ---
  typescript: 5.9.3
  tsx: 4.23.15

  # --- database ---
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  pg: 8.23.1

  # --- jobs ---
  pg-boss: 12.37.1

  # --- validation ---
  zod: 4.6.5

  # --- configuration ---
  dotenv: 17.4.2

  # --- external services ---
  stripe: 22.3.2
  nodemailer: 9.0.3

  # --- parsing ---
  csv-parse: 7.0.3

  # --- logging ---
  pino: 10.4.0

  # --- styling ---
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3

  # --- testing ---
  vitest: 4.1.10
  "@playwright/test": 1.64.0

  # --- lint / format ---
  eslint: 9.39.5
  typescript-eslint: 8.71.1
  prettier: 3.9.9

  # --- types ---
  "@types/node": 26.6.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/pg": 8.23.1
  "@types/nodemailer": 8.0.1
